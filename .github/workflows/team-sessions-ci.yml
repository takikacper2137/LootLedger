name: Team Sessions CI

on:
  push:
    branches: ["feature/team-sessions"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate relay JavaScript syntax
        shell: pwsh
        run: node --check infra/team-relay/src/index.js

      - name: Test team relay
        shell: pwsh
        run: npm test --prefix infra/team-relay

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: team-sessions-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format Rust sources
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE) { throw 'Formatting failed' }

      - name: Test workspace
        shell: pwsh
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE) { throw 'Tests failed' }

      - name: Build Windows release
        shell: pwsh
        run: |
          cargo build --release --locked -p lootledger
          if ($LASTEXITCODE) { throw 'Build failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: LootLedger-Team-Sessions
          path: target/release/lootledger.exe
          if-no-files-found: error
