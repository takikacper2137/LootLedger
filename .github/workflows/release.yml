name: Release

on:
  push:
    branches: ["fix/replay-readiness-and-retry", "fix/isolated-replay-decoder"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install  # the toolchain pinned in rust-toolchain.toml

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format, lint and test
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { throw 'Formatting failed' }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy failed' }
          cargo test --workspace --locked
          if ($LASTEXITCODE) { throw 'Tests failed' }

      - name: Build
        shell: pwsh
        run: |
          cargo build --release --locked -p lootledger
          if ($LASTEXITCODE) { throw 'Build failed' }

      - name: Check runtime dependencies
        shell: pwsh
        run: |
          python scripts/check_pe_runtime.py target/release/lootledger.exe --output target/pe-imports.json
          if ($LASTEXITCODE) { throw 'Unexpected runtime dependency' }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item target\release\lootledger.exe LootLedger.exe
          gh release create $env:GITHUB_REF_NAME LootLedger.exe --title "LootLedger $env:GITHUB_REF_NAME" --notes-file .github/release-notes.md

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: LootLedger
          path: target/release/lootledger.exe
