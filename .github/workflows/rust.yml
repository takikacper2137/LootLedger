name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install  # the toolchain pinned in rust-toolchain.toml
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format, lint and test
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { throw 'Formatting failed' }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy failed' }
          cargo test --workspace --locked
          if ($LASTEXITCODE) { throw 'Tests failed' }
      - name: Build Windows executable
        shell: pwsh
        run: |
          cargo build --release --locked -p lootledger
          if ($LASTEXITCODE) { throw 'Build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: LootLedger
          path: target/release/lootledger.exe
          if-no-files-found: error
